<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hair Research Database</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css?v=4"
    >
</head>

<body>

    <!-- ========================================= -->
    <!-- TOP NAVIGATION -->
    <!-- ========================================= -->

    <header class="topbar">

        <div class="brand">
            Hair Research Database
        </div>

    </header>


    <div class="app-layout">

        <!-- ========================================= -->
        <!-- LEFT SIDEBAR -->
        <!-- ========================================= -->

        <aside class="sidebar">

            <a
                href="/"
                class="sidebar-link active"
            >
                Home
            </a>

            <div class="sidebar-section-title">
                DATA
            </div>

            <a
                href="#"
                id="participantsLink"
                class="sidebar-link"
            >
                Participants
            </a>

            <a
                href="#"
                class="sidebar-link"
            >
                Summary data
            </a>

            <a
                href="#"
                class="sidebar-link"
            >
                Questionnaires
            </a>

            <a
                href="#"
                class="sidebar-link"
            >
                Hair samples
            </a>

            <a
                href="#"
                class="sidebar-link"
            >
                Mass spectrometry
            </a>

            <div class="sidebar-section-title">
                UPDATE DATABASE
            </div>

        </aside>


        <!-- ========================================= -->
        <!-- PAGE CONTENT -->
        <!-- ========================================= -->

        <main class="page-container">

            <section
                id="participantsTableSection"
                class="card hidden"
            >

                <div class="section-header">

                    <div>

                        <h1>
                            Participants
                        </h1>

                    </div>

                </div>

                <div class="participants-filters">

                    <div class="filter-field">
                        <label for="participantSubjectFilter">
                            Subject ID
                        </label>
                        <input
                            id="participantSubjectFilter"
                            type="text"
                            placeholder="Search subject"
                        >
                    </div>

                    <div class="filter-field">
                        <label for="answeredQuestionnaire1Filter">
                            Questionnaire 1
                        </label>
                        <select id="answeredQuestionnaire1Filter">
                            <option value="">All</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="answeredQuestionnaire2Filter">
                            Questionnaire 2
                        </label>
                        <select id="answeredQuestionnaire2Filter">
                            <option value="">All</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="answeredBothFilter">
                            Both questionnaires
                        </label>
                        <select id="answeredBothFilter">
                            <option value="">All</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="filter-field wide-filter-field">
                        <label for="columnFilter">
                            Column
                        </label>
                        <select id="columnFilter">
                            <option value="">Select column</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="conditionFilter">
                            Condition
                        </label>
                        <select id="conditionFilter">
                            <option value="contains">Contains</option>
                            <option value="equals">Equals</option>
                            <option value="not_equals">Does not equal</option>
                            <option value="not_contains">Does not contain</option>
                            <option value="empty">Is empty</option>
                            <option value="not_empty">Is not empty</option>
                            <option value="greater_than">Greater than</option>
                            <option value="less_than">Less than</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="filterValue">
                            Value
                        </label>
                        <input
                            id="filterValue"
                            type="text"
                            placeholder="Filter value"
                        >
                    </div>

                    <button
                        id="clearParticipantsFilters"
                        class="secondary-button filter-clear-button"
                        type="button"
                    >
                        Clear filters
                    </button>

                </div>

                <div class="participants-display-controls">

                    <div class="filter-field wide-filter-field">
                        <label for="testGroupFilter">
                            Show test
                        </label>
                        <select id="testGroupFilter">
                            <option value="">All tests</option>
                        </select>
                    </div>

                    <div class="filter-field wide-filter-field">
                        <label>
                            Hide columns
                        </label>
                        <details
                            id="hiddenColumnsDetails"
                            class="column-hide-picker"
                        >
                            <summary id="hiddenColumnsSummary">
                                Choose columns to hide
                            </summary>
                            <div
                                id="hiddenColumnsFilter"
                                class="column-hide-options"
                            >
                            </div>
                        </details>
                    </div>

                    <label class="checkbox-filter-field">
                        <input
                            id="hideEmptyColumnsFilter"
                            type="checkbox"
                        >
                        Hide empty columns
                    </label>

                    <button
                        id="showAllParticipantsColumns"
                        class="secondary-button filter-clear-button"
                        type="button"
                    >
                        Show all columns
                    </button>

                </div>

                <div
                    id="participantsTableMessage"
                    class="table-message"
                >
                </div>

                <div class="wide-table-wrapper">

                    <table
                        id="participantsTable"
                        class="wide-table hidden"
                    >

                        <thead id="participantsTableHead">
                        </thead>

                        <tbody id="participantsTableBody">
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <!-- ========================================= -->
    <!-- JAVASCRIPT FILES -->
    <!-- ========================================= -->

    <script src="/static/js/participants_table.js?v=10"></script>

</body>

</html>
